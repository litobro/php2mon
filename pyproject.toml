[project]
name = "php2mon"
version = "0.1.0"
description = "Live monitor for PHP2Shell exploitation"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.41",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "maxminddb>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["php2mon"]
