services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: php2mon
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: php2mon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U php2mon"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  sensor-http:
    image: ghcr.io/litobro/php2mon-sensor:latest
    build:
      context: .
      dockerfile: docker/sensor.Dockerfile
    environment: &sensor-env
      CONFIG_DIR: /config
      STATE_DIR: /state
      DATABASE_URL: ${SENSOR_DSN:-postgresql://php2mon:${POSTGRES_PASSWORD}@db:5432/php2mon}
      PORT: "8080"
      GEOIP_DIR: /geoip
    volumes:
      - "${CONFIG_DIR:-./config.example}:/config:ro"
      - sensorstate:/state
      - geoip:/geoip:ro
    ports:
      - "80:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  sensor-https:
    image: ghcr.io/litobro/php2mon-sensor:latest
    build:
      context: .
      dockerfile: docker/sensor.Dockerfile
    environment:
      <<: *sensor-env
      PORT: "8443"
      TLS_DIR: /tls
      TLS_CN: "${TLS_CN:-localhost}"
    volumes:
      - "${CONFIG_DIR:-./config.example}:/config:ro"
      - tlsdata:/tls
      - sensorstate:/state
      - geoip:/geoip:ro
    ports:
      - "443:8443"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: applies schema + least-privilege roles as admin. Run deliberately:
  #   docker compose run --rm dbinit
  # then set SENSOR_DSN / COLLECTOR_DSN / DASHBOARD_DSN in .env (unset = admin DSN).
  dbinit:
    image: ghcr.io/litobro/php2mon-sensor:latest
    profiles: ["dbinit"]
    entrypoint: ["python", "-m", "php2mon.dbinit"]
    environment:
      DATABASE_URL: postgresql://php2mon:${POSTGRES_PASSWORD}@db:5432/php2mon
      SENSOR_DB_PW: "${SENSOR_DB_PW:-}"
      COLLECTOR_DB_PW: "${COLLECTOR_DB_PW:-}"
      DASHBOARD_DB_PW: "${DASHBOARD_DB_PW:-}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  collector:
    image: ghcr.io/litobro/php2mon-collector:latest
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    environment:
      DATABASE_URL: ${COLLECTOR_DSN:-postgresql://php2mon:${POSTGRES_PASSWORD}@db:5432/php2mon}
      CONTACT_EMAIL: "${CONTACT_EMAIL:-}"
      CF_RADAR_TOKEN: "${CF_RADAR_TOKEN:-}"
      SHODAN_API_KEY: "${SHODAN_API_KEY:-}"
      GEOIP_DIR: /geoip
    volumes:
      - geoip:/geoip
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Internal only: no published port. Reached solely through cloudflared.
  dashboard:
    image: ghcr.io/litobro/php2mon-dashboard:latest
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    environment:
      DATABASE_URL: ${DASHBOARD_DSN:-postgresql://php2mon:${POSTGRES_PASSWORD}@db:5432/php2mon}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Outbound-only Cloudflare Tunnel; opens no inbound port. Enable once
  # TUNNEL_TOKEN is set:  COMPOSE_PROFILES=tunnel  (or --profile tunnel).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.2
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    depends_on:
      - dashboard
    restart: unless-stopped

volumes:
  pgdata:
  tlsdata:
  sensorstate:
  geoip:
